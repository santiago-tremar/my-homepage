{% extends "base.html" %}

{% block content %}
  <style>
    .profile-section {
      min-height: calc(100vh - 64px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 48px;
      box-sizing: border-box;
    }

    .profile-picture {
      width: 240px;
      height: 240px;
      flex: 0 0 240px;
      border: 2px solid #262626;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Inter", sans-serif;
      color: #777;
      background-color: #f4f4f4;
    }

    .profile-text {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 320px;
    }

    .profile-text p {
      margin: 0;
      font-family: "Inter", sans-serif;
      color: #2d2d2d;
    }

    .title,
    .subtext,
    .body,
    .links {
      font-family: "Inter", sans-serif;
    }

    .title {
      font-size: 32px;
      font-weight: 700;
    }

    .subtext {
      font-size: 12px;
      font-weight: 200;
    }

    .body {
      font-size: 20px;
      font-weight: 400;
    }

    .links {
      font-size: 16px;
      font-weight: 200;
    }

    .profile-text .links {
      color: #777;
      text-decoration: none;
      line-height: 1;
      margin-top: -4px;
      margin-bottom: -4px;
    }

    @media (max-width: 640px) {
      .profile-section {
        flex-direction: column;
        gap: 32px;
      }

      .profile-text {
        width: min(320px, 100%);
      }
    }
  </style>

  <main class="profile-section">
    <div class="profile-picture" role="img" aria-label="Profile picture placeholder">
      Picture placeholder
    </div>

    <div class="profile-text">
      <p class="title">Santiago Treviño</p>
      <p class="subtext">Python  -  Django  -  Data Analysis</p>
      <p class="body">Passionate about helping people perform their best by automating their workflows.</p>
      <p class="links">santiago.tremar@icloud.com</p>
      <p class="links">in/santiago-tremar</p>
      <p class="links">github.com/santiago-tremar</p>
    </div>
  </main>
{% endblock content %}
